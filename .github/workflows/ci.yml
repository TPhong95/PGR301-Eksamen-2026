name: CI

on:
  push:
    branches: [ main ]

jobs:
  style-check:
    name: Style check
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Sett up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check formatting
        run: mvn -B spotless:check