name: CD

on:
  push:
    branches: [ main ]

jobs:
  push_to_registry:
    name: Push Docker image to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Build and push Docker image
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin 244530008913.dkr.ecr.eu-west-1.amazonaws.com
          VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          SHA=$(git rev-parse --short HEAD)
          IMAGE=244530008913.dkr.ecr.eu-west-1.amazonaws.com/crud-dud-exam-2026
          
          docker build -t wishapp .

          docker tag wishapp:latest $IMAGE:$VERSION-$SHA
          docker push $IMAGE:$VERSION-$SHA

          docker tag wishapp:latest $IMAGE:latest
          docker push $IMAGE:latest